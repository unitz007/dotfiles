apiVersion: dotsync/v1
kind: SyncPolicy
metadata:
  name: charles-dotfiles

spec:
  repository: https://github.com/unitz007/dotfiles
  branch: main
  strategy: symlink
  mode: enforce

  software:
    - name: shell
      configs:
        - source: .zshrc
          target: ~/.zshrc
        - source: zsh
          target: ~/.config/zsh
        - source: ghostty/config
          target: ~/.config/ghostty/config
        - source: .oh-my-posh-theme.json
          target: ~/.oh-my-posh-theme.json

    - name: neovim
      configs:
        - source: nvim
          target: ~/.config/nvim
      packages:
        darwin:
          - manager: brew
            name: neovim
        linux:
          - manager: apt
            name: neovim

    - name: tmux
      configs:
        - source: tmux/tmux.conf
          target: ~/.tmux.conf
      packages:
        darwin:
          - manager: brew
            name: tmux
        linux:
          - manager: apt
            name: tmux

    - name: starship
      packages:
        darwin:
          - manager: brew
            name: starship

    - name: fzf
      configs:
        - source: fzf/.fzf.zsh
          target: ~/.fzf.zsh
      packages:
        darwin:
          - manager: brew
            name: fzf
        linux:
          - manager: apt
            name: fzf

  hooks:
    post_sync:
      - source: scripts/post-sync.sh
