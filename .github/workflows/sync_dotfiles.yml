name: Sync Dotfiles CI

on:
  push:
    paths:
      - 'sync_dotfiles.sh'
      - 'dotfiles.yml'
  pull_request:
    paths:
      - 'sync_dotfiles.sh'
      - 'dotfiles.yml'
  workflow_dispatch:

jobs:
  test-sync-script:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GPG (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg || true
          brew install gnupg || true

      - name: Verify script runs (dry-run)
        run: |
          chmod +x ./sync_dotfiles.sh
          ./sync_dotfiles.sh --push --dry-run