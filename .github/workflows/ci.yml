name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up PowerShell (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-powershell@v2
        with:
          version: '7.x'

      - name: Set up PowerShell (Unix)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v4  # placeholder if any other setup needed

      - name: Run install script (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./install.sh
          ./install.sh

      - name: Run install script (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ensure the script can run with unrestricted policy for this CI run
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          if (Test-Path ./install.ps1) {
            ./install.ps1
          } else {
            Write-Error "install.ps1 not found"
            exit 1
          }

      - name: Verify PowerShell profile creation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profilePath = Join-Path $HOME 'Documents\PowerShell\Microsoft.PowerShell_profile.ps1'
          if (-not (Test-Path $profilePath)) {
            Write-Error "PowerShell profile not found at $profilePath"
            exit 1
          } else {
            Write-Host "PowerShell profile verified at $profilePath"
          }

      - name: Verify symlink/shortcut creation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Example check for a shortcut that install.ps1 should create.
          # Adjust the path below to match the actual expected shortcut location.
          $shortcutPath = Join-Path $HOME 'Desktop\MyTool.lnk'
          if (-not (Test-Path $shortcutPath)) {
            Write-Error "Expected shortcut not found at $shortcutPath"
            exit 1
          } else {
            Write-Host "Shortcut verified at $shortcutPath"
          }

      - name: Verify installation (Unix)
        if: runner.os != 'Windows'
        run: |
          # Simple sanity check that the install script completed without errors.
          echo "Unix installation verification completed."