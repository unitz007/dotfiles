name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v3

      - name: Set up PowerShell Core (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-pwsh@v2
        with:
          pwsh-version: '7.x'

      - name: Run installer
        shell: pwsh
        run: |
          if ("${{ matrix.os }}" -eq "windows-latest") {
            ./install.ps1 -ErrorAction Stop
          } else {
            bash ./install.sh
          }