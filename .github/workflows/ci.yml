name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run tests
        run: ./run-tests.sh

  install-test:
    runs-on: ubuntu-latest
    needs: build
    services:
      docker:
        image: docker:20.10-dind
        privileged: true
        options: >-
          --health-cmd "docker info"
          --health-interval 1m
          --health-timeout 10s
          --health-retries 3
    strategy:
      matrix:
        distro: [ubuntu:latest, fedora:latest, archlinux:latest]
    steps:
      - uses: actions/checkout@v3
      - name: Test install script on ${{ matrix.distro }}
        run: |
          set -e
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ matrix.distro }} bash -c "./install.sh && ./uninstall.sh && echo 'Symlinks verified'"
        timeout-minutes: 10