name: Font Install Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Ensure script is executable
        run: chmod +x ./install_fonts.sh

      - name: Run install_fonts.sh
        run: ./install_fonts.sh