name: Bats Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bats-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bats
        uses: bats-core/bats-action@v1
        with:
          bats-version: "1.10.0"

      - name: Run Bats tests
        run: bats tests