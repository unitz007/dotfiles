name: Bats Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run Bats tests
        run: |
          chmod +x tests/*.bats
          bats tests