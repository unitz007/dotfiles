# GPG Configuration for Git Commit Signing
#
# Portable GPG configuration for use across machines.
# Symlink this file to ~/.gnupg/gpg.conf (or use bootstrap.sh).
# See README.md for full setup instructions.

# Strong algorithm preferences
personal-digest-preferences SHA512 SHA384 SHA256
personal-cipher-preferences AES256 AES192 AES128
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed

# Default signing key — uncomment and replace after importing your key
# default-key <YOUR_KEY_ID>

# Modern keyserver
keyserver hkps://keys.openpgp.org
keyserver-options timeout=10 auto-key-retrieve

# Don't leak GPG version in signatures
no-emit-version

# Cleaner output
no-comments

# Character encoding
charset utf-8
display-charset utf-8

# ---------------------------------------------------------------
# Importing a private key on a new machine:
#
#   1. Transfer your exported private key securely (e.g., via USB
#      or an encrypted channel — never over plain text).
#   2. Import it:
#        gpg --import private.key
#   3. Verify the key was imported:
#        gpg --list-secret-keys --keyid-format=long
#   4. Delete the private key file immediately:
#        shred -u private.key   # or: rm -P private.key (macOS)
#   5. Set the trust level:
#        gpg --edit-key <KEY_ID> trust quit
#      Choose "5" (I trust ultimately) to mark the key as trusted.
# ---------------------------------------------------------------
