# GPG Agent Configuration
#
# Configures the GPG agent for terminal-based workflows (tmux, SSH).
# Symlink this file to ~/.gnupg/gpg-agent.conf (or use bootstrap.sh).
# After changing this file, restart the agent:
#   gpgconf --kill gpg-agent

# Pinentry program for passphrase prompts
#   /usr/bin/pinentry-curses  — ncurses-based (default, works in most terminals)
#   /usr/bin/pinentry-tty     — pure terminal, no ncurses dependency
#   /usr/local/bin/pinentry-mac — macOS GUI prompt (requires GPG Suite)
pinentry-program /usr/bin/pinentry-curses

# Cache passphrase for 1 hour (3600 seconds)
default-cache-ttl 3600

# Maximum cache duration of 2 hours (7200 seconds)
max-cache-ttl 7200

# SSH key cache for 1 hour
default-cache-ttl-ssh 3600

# Maximum SSH cache duration of 2 hours
max-cache-ttl-ssh 7200

# Allow Emacs pinentry (not needed for terminal/tmux workflows)
# allow-emacs-pinentry
