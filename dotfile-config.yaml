# Enhanced Dotfile Agent Configuration
# 
# This format includes installation commands as structured data
# that can be parsed and used programmatically.
#
# Structure:
#   software: Name of the software
#   install: Installation command(s)
#   files: List of dotfiles to sync
#     - path: File/directory path (directories end with ;)
#       target: Target location (home is replaced with $HOME)

# Enhanced Dotfile Agent Configuration
# 
# This format includes installation commands as structured data
# that can be parsed and used programmatically.
#
# Structure:
#   software: Name of the software
#   install: Installation command(s) - can be string or platform-specific map
#   files: List of dotfiles to sync
#     - path: File/directory path (directories end with ;)
#       target: Target location (home is replaced with $HOME)
#
# Platform-specific installs:
#   install:
#     linux: apt install -y package
#     darwin: brew install package
#     windows: choco install package
#
# Supported platforms: linux, darwin (macOS), windows, freebsd, openbsd
# Use 'all' for cross-platform commands (like curl scripts)

dotfiles:
  - software: bash
    install:
      linux: apt install -y bash
      darwin: brew install bash
    files:
      - path: .bashrc
        target: home
      - path: .bash_profile
        target: home
      - path: .bash_aliases
        target: home

  - software: zsh
    install:
      linux: apt install -y zsh
      darwin: brew install zsh
    files:
      - path: .zshrc
        target: home
      - path: .zsh_aliases
        target: home
      - path: zsh;
        target: home/.config

  - software: git
    install:
      linux: apt install -y git
      darwin: brew install git
      windows: choco install git
    files:
      - path: .gitconfig
        target: home
      - path: .gitignore_global
        target: home
      - path: git;
        target: home/.config

  - software: gnupg
    install:
      linux: apt install -y gnupg pinentry-curses
      darwin: brew install gnupg pinentry-mac
    files:
      - path: gpg/gpg.conf
        target: home/.gnupg
      - path: gpg/gpg-agent.conf
        target: home/.gnupg

  - software: delta
    install:
      linux: apt install -y git-delta
      darwin: brew install git-delta
    files:
      - path: delta;
        target: home/.config

  - software: vim
    install:
      linux: apt install -y vim
      darwin: brew install vim
    files:
      - path: .vimrc
        target: home

  - software: neovim
    install:
      linux: apt install -y neovim
      darwin: brew install neovim
      windows: choco install neovim
    files:
      - path: nvim;
        target: home/.config

  - software: tmux
    install:
      linux: apt install -y tmux
      darwin: brew install tmux
      all: |
        if [ ! -d "$HOME/.tmux/plugins/tpm" ]; then
          git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm"
        fi
    files:
      - path: .tmux.conf
        target: home

  - software: bat
    install:
      linux: apt install -y bat
      darwin: brew install bat
    files:
      - path: bat;
        target: home/.config

  - software: fzf
    install:
      linux: apt install -y fzf
      darwin: brew install fzf
    files:
      - path: fzf;
        target: home/.config

  - software: openssh-client
    install:
      linux: apt install -y openssh-client
      darwin: ""
    files:
      - path: ssh/config
        target: home/.ssh

  - software: alacritty
    install:
      linux: apt install -y alacritty
      darwin: brew install --cask alacritty
    files:
      - path: alacritty;
        target: home/.config

  - software: kitty
    install:
      linux: apt install -y kitty
      darwin: brew install --cask kitty
    files:
      - path: kitty;
        target: home/.config

  # Keyboard customization
  - software: karabiner-elements
    install:
      darwin: brew install --cask karabiner-elements
    files:
      - path: karabiner;
        target: home/.config

  - software: starship
    install:
      all: curl -sS https://starship.rs/install.sh | sh
    files:
      - path: starship.toml
        target: home/.config

  - software: direnv
    install:
      linux: apt install -y direnv
      darwin: brew install direnv
    files:
      - path: .direnvrc
        target: home
      - path: direnv.toml
        target: home

  - software: zoxide
    install:
      linux: apt install -y zoxide
      darwin: brew install zoxide
    files:
      - path: zoxide
        target: home

  - software: atuin
    install:
      linux: curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh
      darwin: brew install atuin
    files:
      - path: atuin;
        target: home/.config

