# ------------------------------------------------------------
# Tmux Configuration – Enhanced for usability & latest version
# ------------------------------------------------------------

# --- General Settings -------------------------------------------------
# Enable mouse support (selection, resizing, scrolling)
set -g mouse on

# Use 256‑color mode and set a modern terminal type
set -g default-terminal "screen-256color"

# Increase history size for deep scrollback
set -g history-limit 10000

# Use 1‑based indexing (more intuitive for most users)
set -g base-index 1
setw -g pane-base-index 1

# Enable vi‑style key bindings in copy mode
setw -g mode-keys vi

# Faster status refresh (seconds)
set -g status-interval 5

# --- Status Bar -------------------------------------------------------
# Left side: session name in green
set -g status-left-length 40
set -g status-left '#[fg=green,bold] #S #[default]'

# Right side: date, time and host in yellow
set -g status-right-length 80
set -g status-right '#[fg=yellow] %Y-%m-%d %H:%M #[default]'

# Status bar style
set -g status-style bg=colour235,fg=colour136

# Window list style
setw -g window-status-current-format '#[bg=colour28,fg=colour231] #I:#W #[default]'
setw -g window-status-format '#[bg=colour235,fg=colour244] #I:#W #[default]'

# --- Reload & Convenience ---------------------------------------------
# Reload configuration without leaving tmux
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Clear pane history (useful after long sessions)
bind C run-shell "tmux clear-history" \; display-message "Pane history cleared"

# Toggle pane synchronization (useful for broadcasting commands)
bind s setw synchronize-panes \; display-message "Synchronize panes: #{?pane_synchronized,on,off}"

# List all key bindings (quick reference)
bind ? list-keys

# --- Pane Management ---------------------------------------------------
# Split panes using Vim‑style keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt‑hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes with Alt‑Shift‑hjkl
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# --- Copy Mode Enhancements -------------------------------------------
# Use 'v' to begin selection, 'y' to copy to system clipboard (requires xclip/xsel)
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Quick scroll in copy mode
bind-key -T copy-mode-vi C-u send -X halfpage-up
bind-key -T copy-mode-vi C-d send -X halfpage-down

# --- Plugin Support (Tmux Plugin Manager) -----------------------------
# Ensure TPM is installed; if not, display a friendly reminder.
if-shell '[ -d "$HOME/.tmux/plugins/tpm" ]' '' \
  'run-shell "echo \\"Tmux Plugin Manager not found. Install with: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm\\" && sleep 5"'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TPM (keep this line at the very end of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

# --- Compatibility Checks -----------------------------------------------
# Example: Adjust settings for tmux >= 3.2 (newer defaults)
if-shell '[ "$(tmux -V | cut -d" " -f2 | cut -d"." -f1)" -ge 3 ]' \
  'set -g status-format[0] "#[fg=cyan]#(whoami)@#H"'

# End of .tmux.conf