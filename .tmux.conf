# TPM (Tmux Plugin Manager) configuration
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TPM (must be at the very end of the file)
run '~/.tmux/plugins/tpm/tpm'

# ----------------------------------------------------------------------
# Core Settings – performance & usability
# ----------------------------------------------------------------------
# Enable mouse support for pane resizing, window selection, etc.
set -g mouse on

# Increase scrollback buffer for better history navigation
set -g history-limit 10000

# Use 1‑based indexing (more intuitive for most developers)
set -g base-index 1
set -g pane-base-index 1

# Reduce latency for key sequences
set -g escape-time 0
set -g repeat-time 500

# Ensure 256‑color support
set -g default-terminal "screen-256color"

# Use the user's default shell for new panes
set -g default-command $SHELL

# ----------------------------------------------------------------------
# Status Bar – clean and informative
# ----------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-left '#[fg=green]#S #[default]'
set -g status-right '#[fg=yellow]%Y-%m-%d %H:%M #[default]'

# ----------------------------------------------------------------------
# Prefix & Key Bindings
# ----------------------------------------------------------------------
# Change the default prefix from C‑b to C‑a (screen‑style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload configuration quickly
bind r source-file ~/.tmux.conf \; display "Tmux config reloaded"

# Pane splitting shortcuts
bind | split-window -h
bind - split-window -v

# Vim‑style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim‑style pane resizing (hold Shift)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable vi keys in copy mode
setw -g mode-keys vi

# ----------------------------------------------------------------------
# tmux‑continuum (automatic saving & restoring)
# ----------------------------------------------------------------------
set -g @continuum-restore 'on'          # Restore last session on tmux start
set -g @continuum-save-interval '15'    # Save every 15 minutes

# ----------------------------------------------------------------------
# Ensure plugins are installed on first run
# ----------------------------------------------------------------------
run-shell '~/.tmux/plugins/tpm/scripts/install_plugins.sh'