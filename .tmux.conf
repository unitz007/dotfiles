# ~/.tmux.conf - Enhanced configuration
# -------------------------------------------------
# General Settings & Performance Optimizations
# -------------------------------------------------
# Use vi keys in copy mode
setw -g mode-keys vi

# Enable mouse support (scroll, pane resize, window selection)
set -g mouse on

# Increase history limit for better scrollback
set -g history-limit 100000

# Faster key repeat and escape handling
set -sg escape-time 0
set -sg repeat-time 500

# Start indexing at 1 (more intuitive)
set -g base-index 1
setw -g pane-base-index 1

# Reduce delay for status updates
set -g status-interval 2

# Use 256 colour mode
set -g default-terminal "screen-256color"

# -------------------------------------------------
# Prefix Key
# -------------------------------------------------
# Change prefix from 'C-b' to 'C-a' (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -------------------------------------------------
# Reload configuration
# -------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Tmux config reloaded!"

# -------------------------------------------------
# Pane Management
# -------------------------------------------------
# Split panes using | and -
bind | split-window -h
bind - split-window -v
# Switch panes using Alt + arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Resize panes with Alt + Shift + arrow keys
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Down resize-pane -D 5

# -------------------------------------------------
# Window Management
# -------------------------------------------------
# Create a new window with 'c'
bind c new-window
# Close the current pane/window with 'x'
bind x kill-pane
# Switch windows with Alt + number
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# -------------------------------------------------
# Copy & Paste (using system clipboard)
# -------------------------------------------------
# Use xclip (Linux) or pbcopy (macOS) for clipboard integration
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "if command -v xclip > /dev/null; then xclip -selection clipboard; elif command -v pbcopy > /dev/null; then pbcopy; else cat > /dev/null; fi"

# -------------------------------------------------
# Plugin Management (TPM)
# -------------------------------------------------
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Enable automatic saving of sessions (continuum)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'