# Kitty Terminal Emulator Configuration
# Theme: Catppuccin Mocha (matches neovim + tmux)
# Font: JetBrainsMono Nerd Font (oh-my-posh icon compatibility)
# Synced via dotfile-config.yaml → ~/.config/kitty/

# ── Font settings ──────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16

# ── Color scheme: Catppuccin Mocha ─────────────────────────────────────────
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

# Black
color0                  #45475A
color8                  #585B70
# Red
color1                  #F38BA8
color9                  #F38BA8
# Green
color2                  #A6E3A1
color10                 #A6E3A1
# Yellow
color3                  #F9E2AF
color11                 #F9E2AF
# Blue
color4                  #89B4FA
color12                 #89B4FA
# Magenta
color5                  #F5C2E7
color13                 #F5C2E7
# Cyan
color6                  #94E2D5
color14                 #94E2D5
# White
color7                  #BAC2DE
color15                 #A6ADC8

# Mark colors
mark1_foreground        #1E1E2E
mark1_background        #B4BEFE
mark2_foreground        #1E1E2E
mark2_background        #94E2D5

# Tab bar colors
active_tab_foreground   #1E1E2E
active_tab_background   #89B4FA
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825

# ── Window layout ──────────────────────────────────────────────────────────
window_padding_width    8
window_margin_width     0
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      " {index}: {title} "
hide_window_decorations titlebar-only

# ── Shell integration ──────────────────────────────────────────────────────
shell                   zsh
shell_integration        enabled

# ── macOS-specific options ─────────────────────────────────────────────────
macos_option_as_alt             yes
macos_titlebar_color            background
macos_quit_when_last_window_closed yes

# ── Performance tuning ─────────────────────────────────────────────────────
cursor_blink_interval    0
scrollback_lines         10000
enable_audio_bell        no
visual_bell_duration     0.0
update_check_interval    0
confirm_os_window_close  2

# ── Keybindings ────────────────────────────────────────────────────────────
# Copy/paste (ctrl+shift to avoid skhd ctrl+single-letter conflicts)
map ctrl+shift+c               copy_to_clipboard
map ctrl+shift+v               paste_from_clipboard

# New window/tab preserving working directory
map cmd+shift+enter            new_window_with_cwd
map cmd+shift+t                new_tab_with_cwd

# Tab navigation
map cmd+shift+]                next_tab
map cmd+shift+[                previous_tab
map cmd+1                      goto_tab 1
map cmd+2                      goto_tab 2
map cmd+3                      goto_tab 3
map cmd+4                      goto_tab 4
map cmd+5                      goto_tab 5
map cmd+6                      goto_tab 6
map cmd+7                      goto_tab 7
map cmd+8                      goto_tab 8
map cmd+9                      goto_tab 9

# Neighboring window navigation (cmd+shift to avoid aerospace alt-hjkl conflicts)
map cmd+shift+left             neighboring_window left
map cmd+shift+right            neighboring_window right
map cmd+shift+up               neighboring_window up
map cmd+shift+down             neighboring_window down

# ── Kitten aliases ─────────────────────────────────────────────────────────
kitten_alias hints             hints --program /usr/local/bin/open
kitten_alias diff              diff

# ── Scrollback pager ───────────────────────────────────────────────────────
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Miscellaneous ──────────────────────────────────────────────────────────
allow_remote_control    socket-only
listen_on               unix:/tmp/kitty.sock
clipboard_control       write-clipboard read-clipboard-ask
strip_trailing_spaces   smart
term                    xterm-256color
