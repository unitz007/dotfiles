# Kitty Terminal Emulator Configuration
# Theme: Catppuccin Mocha (matches neovim + tmux)
# Font: JetBrains Mono
# Synced via dotfile-config.yaml → ~/.config/kitty/

# Font settings
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
adjust_line_height  110%
adjust_column_width 95%

# Catppuccin Mocha color scheme
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC
cursor                  #F5E0DC
cursor_text_color       #1E1E2E
# Black
color0                  #45475A
color8                  #585B70
# Red
color1                  #F38BA8
color9                  #F38BA8
# Green
color2                  #A6E3A1
color10                 #A6E3A1
# Yellow
color3                  #F9E2AF
color11                 #F9E2AF
# Blue
color4                  #89B4FA
color12                 #89B4FA
# Magenta
color5                  #F5C2E7
color13                 #F5C2E7
# Cyan
color6                  #94E2D5
color14                 #94E2D5
# White
color7                  #BAC2DE
color15                 #A6ADC8
# Tab bar colors
active_tab_foreground   #1E1E2E
active_tab_background   #89B4FA
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825

# Window layout and padding
window_padding_width    8
hide_window_decorations titlebar-only
confirm_os_window_close 0

# Cursor style
cursor_shape beam
cursor_blink_interval   0
cursor_stop_blinking_after 15.0

# Shell integration
shell_integration enabled

# Scrollback and performance
scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAWCONTROL-CHARS +INPUT_LINE_NUMBER

# Keybindings
# New tab / close tab
map ctrl+t       new_tab
map ctrl+w       close_tab
# Navigate tabs (consistent with alt+hjkl from AeroSpace)
map alt+h        previous_tab
map alt+l        next_tab
# New window (vertical/horizontal split, matching tmux conventions)
map ctrl+shift+enter  new_window_with_cwd
# Copy/paste
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard
# Font size adjustment
map ctrl+equal    change_font_size all +1.0
map ctrl+minus    change_font_size all -1.0
map ctrl+0        change_font_size all 0
# Clear terminal
map ctrl+l        clear_terminal scroll active

# Tab bar styling
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    slanted

# Mouse
mouse_hide_wait        3.0
url_style              curly
open_url_with          default

# Bell
enable_audio_bell      no
visual_bell_duration   0.0
window_alert_on_bell   yes
