# set true color
set-option -sa terminal-overrides ",xter*:Tc"

# number windows and panes from 1, and close gaps when a window is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# vim-style copy mode
set-window-option -g mode-keys vi
bind [ copy-mode
bind-key -T copy-mode-vi k send-keys -X scroll-up
bind-key -T copy-mode-vi j send-keys -X scroll-down
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin_tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~claude->claude --continue"'

# tmux-continuum settings
# sessions are rebuilt by the `tm` script; restore anything else with prefix C-r
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# status bar
set -g status-interval 1
set -g status-left-length 60
set -g status-right-length 100
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#f5c2e7,fg=#1e1e2e"

set -g window-status-separator ""
# prefix g <letter>: jump to the window whose name starts with that letter (repeat to cycle)
bind g switch-client -T goto \; display-message "Go to window: press its first letter"
run-shell '~/.tmux/tmux-goto --bind'

# Claude Code state per window, set by ~/.tmux/claude-tmux-state from Claude hooks (claude-hooks.json):
# spinner = working, ● = needs you, ✓ = finished (cleared when you open the window), ✗ = failed
set -g @claude_spin '#{s/0/⠋/:#{s/1/⠙/:#{s/2/⠹/:#{s/3/⠸/:#{s/4/⠼/:#{s/5/⠴/:#{s/6/⠦/:#{s/7/⠧/:#{s/8/⠇/:#{s/9/⠏/:#{=-1:#{l:%S}}}}}}}}}}}}'
set -g @claude_ind '#{?#{==:#{@claude_state},working},#[fg=#f9e2af]#{T:@claude_spin} ,#{?#{==:#{@claude_state},waiting},#[fg=#fab387]● ,#{?#{==:#{@claude_state},done},#[fg=#a6e3a1]✓ ,#{?#{==:#{@claude_state},error},#[fg=#f38ba8]✗ ,}}}}'
set -g @claude_ind_current '#{?#{==:#{@claude_state},working},#{T:@claude_spin} ,#{?#{==:#{@claude_state},waiting},● ,#{?#{==:#{@claude_state},done},✓ ,#{?#{==:#{@claude_state},error},✗ ,}}}}'
set-hook -g session-window-changed 'if -F "#{==:#{@claude_state},done}" "set -wu @claude_state"'

set -g window-status-format " #[fg=#6c7086,bg=#1e1e2e]#I:#W #{E:@claude_ind}"
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #{E:@claude_ind_current}#[fg=#89b4fa,bg=#1e1e2e]"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

set -g status-left '#[fg=#1e1e2e,bg=#{?selection_present,#f5c2e7,#{?pane_in_mode,#f9e2af,#89b4fa}},bold] #{?selection_present,VISUAL,#{?pane_in_mode,COPY,TMUX}} #[fg=#{?selection_present,#f5c2e7,#{?pane_in_mode,#f9e2af,#89b4fa}},bg=#1e1e2e] #S '
set -g status-right '#[fg=#6c7086,bg=#1e1e2e] %H:%M #[fg=#cba6f7]#h '

run '~/.tmux/plugins/tpm/tpm'
